<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conectando...</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0;
    background: #f8f7f5; color: #1a1714;
  }
  .box { text-align: center; max-width: 360px; padding: 0 24px; }
  .spinner {
    width: 48px; height: 48px; border-radius: 50%;
    border: 3px solid #e5e2dc; border-top-color: #e1306c;
    animation: spin .8s linear infinite; margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { font-size: 20px; margin-bottom: 8px; }
  p { color: #6b6560; font-size: 14px; }
  .error { color: #991b1b; background: #fee2e2; padding: 12px 16px; border-radius: 10px; margin-top: 16px; font-size: 14px; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <h2 id="title">Conectando sua conta...</h2>
  <p id="subtitle">Aguarde enquanto validamos o acesso ao Instagram.</p>
  <div class="error" id="error" style="display:none"></div>
</div>
<script>
const N8N_BASE = 'https://rarelookingorca-n8n.cloudfy.live/webhook';
const REDIRECT_URI = window.location.origin + '/callback.html';

async function run() {
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const error = params.get('error');

  if (error) {
    showError('Acesso negado: ' + (params.get('error_description') || error));
    return;
  }

  if (!code) {
    showError('Código de autorização não recebido.');
    return;
  }

  try {
    document.getElementById('subtitle').textContent = 'Trocando código por token de acesso...';

    const res = await fetch(`${N8N_BASE}/instagram-auth`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, redirect_uri: REDIRECT_URI }),
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!data.user_id) throw new Error('Resposta inválida do servidor.');

    try {
      localStorage.setItem('ig_session', JSON.stringify({
        user_id: data.user_id,
        username: data.username,
        connected_at: Date.now(),
      }));
    } catch(e) {}

    document.getElementById('title').textContent = 'Conectado! ✓';
    document.getElementById('subtitle').textContent = 'Redirecionando para o dashboard...';
    document.getElementById('spinner').style.borderTopColor = '#22c55e';

    setTimeout(() => { window.location.href = '/'; }, 1200);

  } catch(e) {
    showError('Erro ao conectar: ' + e.message);
  }
}

function showError(msg) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('title').textContent = 'Algo deu errado';
  document.getElementById('subtitle').textContent = '';
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}

run();
</script>
</body>
</html>
